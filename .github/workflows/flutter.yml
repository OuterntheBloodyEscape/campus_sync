name: Flutter Build
on:
  push:
    branches: [ "main", "second-branch" ]
  pull_request:
    branches: [ "main", "second-branch" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --debug
